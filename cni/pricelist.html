<body>
  <div class="container-fluid row">
    <div class="col col-lg-3 col-md-3 col-xs-3 col-sm-3">
      <form>
        <div class="input-group">
          <input type="text" class="form-control" id="search" placeholder="kode / nama / harga">

  </div>
  <div class="container-fluid row">
    <div class="col col-lg-12 col-md-12 col-xs-12 col-sm-12">

        </tr>
      </thead>

      </tbody>
      </table>
    </div>
  </div>

  font-family: Roboto;
}

  cursor: pointer;
}
.table-bordered td, .table-bordered th {
  color: #000;
  border: 1px solid #000!important;
  font-size: clamp(0.618rem, 1.236vw, 1rem);
}
@media print {
  form, .icon {display:none}
  @page {size: 14in portrait}
}
